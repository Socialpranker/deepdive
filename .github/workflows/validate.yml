name: validate

# Deterministic guards that run on every PR — the contributor-facing safety net.
# None of these need an LLM or paid tokens: they check structure, context budget,
# and (on the fixture) live citation resolution. A PR that bloats SKILL.md, breaks
# the output schema, or adds a dead control URL fails here.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structure-and-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff==0.15.1
          ruff check .

      # tests/test_report_export.py and test_mermaid_figures.py exercise build_report's
      # error handling, which only gets reached once pandoc exists — without it every one
      # of them dies on "pandoc не найден" and the export path goes unverified. They
      # passed on the author's Mac and had never run here.
      - name: Install pandoc (report export tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pandoc

      # ВРЕМЕННЫЙ ШАГ — удалить после диагностики test_end_to_end_html
      - name: TEMP diag pandoc footnotes
        run: |
          pandoc --version | head -3
          cat > /tmp/diag.md <<'MD'
          # Отчёт

          Утверждение с источником [s01].[^a]

          [^a]: Оговорка к утверждению.

          {{fig:F1}}
          MD
          echo "--- raw md ---"
          cat -A /tmp/diag.md | head -20
          echo "--- pandoc html ---"
          pandoc /tmp/diag.md -f markdown+footnotes -t html5 --no-highlight --wrap=none
          echo "--- exit: $? ---"
          echo "--- via build_report.md_to_html (то, что реально видит sidenotes) ---"
          python - <<'PY'
          import sys, pathlib
          sys.path.insert(0, "scripts")
          import build_report as br
          out = br.md_to_html(pathlib.Path("/tmp/diag.md"))
          print(repr(out))
          print("BLOCK MATCH:", bool(br.FOOTNOTE_BLOCK.search(out)))
          print("ITEMS:", br.FOOTNOTE_ITEM.findall(out))
          print("REFS:", br.FOOTNOTE_REF.findall(out))
          PY

      - name: Run unit tests
        run: python -m pytest tests/ -q

      - name: Check docs are in sync with sources (fail if a count/phase drifted)
        run: python scripts/stamp_docs.py --check

      - name: Validate fixture run structure
        run: python eval/validate_structure.py --research-dir eval/questions/_fixture --strict || true
        # _fixture has only sources.csv (control URLs) — structure check is informational here;
        # drop the `|| true` once a full fixture run (plan.md + report) is committed.

      # Runs LAST on purpose. This step was red from 2026-07-16 to 2026-08-17, and while
      # it sat above the others every run stopped here — tests, doc-sync and the
      # structure check were reported as skipped and effectively went unchecked for a
      # month. A guard that hides the results of every other guard is worse than the
      # breach it reports, so the correctness checks run first and this one still fails
      # the job. Both budgets are green as of 2026-08-17; it stays last regardless.
      - name: Context budget (fail if SKILL.md / always-floor over budget)
        run: python scripts/context_budget.py --ci

  citation-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt

      - name: Citation checker resolves controls correctly
        # _fixture/sources.csv has a live control (example.com) and a dead control
        # (…/definitely-404…). This proves the checker still flags hallucinated URLs.
        run: |
          python eval/check_citations.py \
            --research-dir eval/questions/_fixture \
            --out eval/output/ci_fixture --json
          python - <<'PY'
          import json
          r = json.load(open("eval/output/ci_fixture.json"))
          flags = [x for x in r["results"] if x["red_flag"]]
          assert any("404" in x["url"] or not x["alive"] for x in r["results"]), "dead control not detected"
          assert flags, "expected at least one red flag from the dead control URL"
          print(f"OK — {len(flags)} red flag(s) caught, integrity={r['citation_integrity']:.2f}")
          PY
